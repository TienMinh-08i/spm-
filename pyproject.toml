[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "specmind-dataset-eval"
version = "2.0.0"
description = "Auditable repository-level SpecMind dataset evaluation"
requires-python = ">=3.11"
dependencies = ["openai==2.36.0", "pytest==8.4.2"]

[project.optional-dependencies]
mutation = ["mutmut==2.5.1"]
marshmallow = ["simplejson==3.20.2", "tzdata==2025.2"]

[project.scripts]
specmind-eval = "specmind_eval.cli:main"
specmind-prep = "specmind_prep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"specmind_eval.generate" = ["prompts/*.txt"]
specmind_eval = ["provenance.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
